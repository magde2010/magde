name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Dev tools are pinned in requirements-dev.txt: an unpinned linter
          # silently turns `main` red whenever a new ruff rule ships.
          pip install -r requirements-dev.txt

      - name: Lint (ruff quality gate)
        run: ruff check .

      - name: Byte-compile all modules
        run: python -m compileall -q -x '(\.git|\.venv)' .

      - name: Run unit tests
        run: python -m pytest -q
